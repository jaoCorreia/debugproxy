name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
            pkg_name: debugproxy-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            pkg_name: debugproxy-windows-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            pkg_name: debugproxy-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/debugproxy${{ matrix.suffix }} ${{ matrix.pkg_name }}${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg_name }}
          path: ${{ matrix.pkg_name }}${{ matrix.suffix }}
          if-no-files-found: error
