name: Release

# Cutting a `v*` tag is the trigger: build the binary on each OS and attach the
# archives to a GitHub Release for that tag. No tag, no release.
on:
  push:
    tags:
      - 'v*'

permissions:
  # softprops/action-gh-release needs write to create the release and upload.
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # One platform failing shouldn't discard the binaries that did build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Space-separated: fed to `rustup target add` and looped over below.
            targets: x86_64-unknown-linux-gnu
            bin: debugproxy
            archive: debugproxy-linux-x86_64
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            bin: debugproxy.exe
            archive: debugproxy-windows-x86_64
          - os: macos-latest
            # Apple Silicon only — GitHub's Intel (macos-13) runners have such
            # limited capacity that jobs can sit queued for hours on public
            # repos, so Intel Macs are unsupported rather than blocking releases.
            targets: aarch64-apple-darwin
            bin: debugproxy
            archive: debugproxy-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --target "$target"
          done

      - name: Assemble binary
        shell: bash
        run: |
          mkdir dist
          targets=(${{ matrix.targets }})
          if [ ${#targets[@]} -gt 1 ]; then
            # macOS: fuse the per-arch builds into a single universal binary.
            lipo -create -output "dist/${{ matrix.bin }}" \
              $(printf "target/%s/release/${{ matrix.bin }} " "${targets[@]}")
          else
            cp "target/${targets[0]}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          fi

      - name: Add quarantine-removal helper (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cp scripts/remove-quarantine.sh dist/

      - name: Package
        shell: bash
        run: |
          cd dist
          cp ../README.md ../config.example.json ../routes.example.json .
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.archive }}.zip" ./*
          else
            tar czf "../${{ matrix.archive }}.tar.gz" ./*
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Only one of these exists per OS; the glob quietly skips the other.
          files: ${{ matrix.archive }}.*
