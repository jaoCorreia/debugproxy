name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # One platform failing shouldn't discard the binaries that did build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Space-separated: fed to `rustup target add` and looped over below.
            targets: x86_64-unknown-linux-gnu
            bin: debugproxy
            archive: debugproxy-linux-x86_64
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            bin: debugproxy.exe
            archive: debugproxy-windows-x86_64
          - os: macos-latest
            # Two targets → lipo'd into one universal binary that runs on both
            # Apple Silicon and Intel Macs.
            targets: aarch64-apple-darwin x86_64-apple-darwin
            bin: debugproxy
            archive: debugproxy-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Validate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag v${TAG_VERSION} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "✓ tag v${TAG_VERSION} == Cargo.toml ${CARGO_VERSION}"

      - name: Build
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target"
          done

      - name: Assemble binary
        shell: bash
        run: |
          mkdir dist
          targets=(${{ matrix.targets }})
          if [ ${#targets[@]} -gt 1 ]; then
            # macOS: fuse the per-arch builds into a single universal binary.
            lipo -create -output "dist/${{ matrix.bin }}" \
              $(printf "target/%s/release/${{ matrix.bin }} " "${targets[@]}")
          else
            cp "target/${targets[0]}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          fi

      - name: Add quarantine-removal helper (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cp scripts/remove-quarantine.sh dist/

      - name: Package
        shell: bash
        run: |
          cd dist
          cp ../README.md ../config.example.json ../routes.example.json .
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.archive }}.zip" ./*
          else
            tar czf "../${{ matrix.archive }}.tar.gz" ./*
          fi

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Only one of these exists per OS; the glob quietly skips the other.
          files: ${{ matrix.archive }}.*
